version: "3.9"

services:
  agent-memory:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/invincible-jha/agent-memory:latest
    container_name: agent-memory
    ports:
      - "8084:8084"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
